; GB Mod Loader settings - Pingus Better BoX AI 2 on its own, stock game
; Sits next to winmm.dll in <IL-2>\bin\game. Lines starting with ; are notes and are ignored.
; Do NOT use this file together with Jungle Hawks: it would switch the Jungle Hawks plugins off.

[loader]
enabled=1
log=1
; plugins left in gbml\ by other mods are not started
auto_load=0
update_ini=0

[plugins]
bbai=1
